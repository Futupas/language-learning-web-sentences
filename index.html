<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Language Reader</title>
</head>
<body>
    <div id="app">
        <!-- Setup View -->
        <section id="setup-view" class="view active">
            <header class="app-header">
                <h1>Texts</h1>
                <p class="subtitle" id="course-metadata">Select a text to read</p>
            </header>
            
            <div class="form-group">
                <label>Translation Language:</label>
                <div id="lang-group" class="button-group">
                    <!-- Injected via TS -->
                </div>
            </div>

            <div class="form-group">
                <label>Filter by Tags:</label>
                <div id="tags-container" class="button-group">
                    <!-- Injected via TS -->
                </div>
            </div>

            <div class="form-group">
                <label>Available Texts:</label>
                <div id="texts-container" class="texts-list">
                    <!-- Injected via TS -->
                </div>
            </div>

            <footer class="app-footer">
                <p><a href="about.html">About / Legal</a></p>
            </footer>
        </section>

        <!-- Reader View -->
        <section id="reader-view" class="view">
            <header class="reader-header">
                <button id="back-btn" class="secondary-btn">🡸 Back</button>
                <div id="audio-container"></div>
            </header>

            <div id="text-container" class="text-area"></div>
        </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
